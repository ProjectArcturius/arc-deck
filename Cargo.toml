[workspace]
resolver = "2"
members = [
    "crates/arc-deck-shell",
    "probes/ime-probe",
    "probes/layout-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Takahashi Rinta <mc1586182829@outlook.com>"]
repository = "https://github.com/GuitaristRin/arc-deck"

[workspace.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_Ime",
    "Win32_UI_WindowsAndMessaging",
] }
