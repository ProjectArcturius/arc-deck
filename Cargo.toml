# Arc Deck —— 两个实现并列
#
#   kanesumi/   Rust + 自绘 Scene（跨平台，无 WebView）  ← 本 workspace 管这个
#   uwp/        C# + WinUI 2（Windows 专属，MSBuild 管）
#
# 两者共享设计正典与控件规格，**不共享实现代码**（参 AGENTS.md 的扇区模型）。

[workspace]
resolver = "2"
members = [
    "kanesumi/crates/arc-deck-shell",
    "kanesumi/probes/ime-probe",
    "kanesumi/probes/layout-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Takahashi Rinta <mc1586182829@outlook.com>"]
repository = "https://github.com/ProjectArcturius/arc-deck"

[workspace.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_Ime",
    "Win32_UI_WindowsAndMessaging",
] }
