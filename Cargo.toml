# Arc Deck —— 产品分两部分
#
#   crates/arc-deck-core  Rust 共用产品模型（任务/配置/结果/事件/Agent/授权）
#   crates/arc-deck-dsh   DSH 适配与假 SDK 对端
#   crates/arc-deck-cli   headless worker 命令
#   crates/arc-deck-tui   终端呈现（由同一个 arcdeck 的无参数入口启动）
#   kanesumi/             早期自绘 GUI（已暂停新增功能，见 docs/PRODUCT_PLAN.md §4.2）
#   uwp/                  Windows GUI（C# + WinUI 2，MSBuild 管，不在本 workspace）
#
# 跨 crate 依赖方向：core → dsh → cli、core → tui → cli；呈现层不自建 DSH 客户端。

[workspace]
resolver = "2"
members = [
    "crates/arc-deck-core",
    "crates/arc-deck-dsh",
    "crates/arc-deck-cli",
    "crates/arc-deck-tui",
    "kanesumi/crates/arc-deck-shell",
    "kanesumi/probes/ime-probe",
    "kanesumi/probes/layout-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Takahashi Rinta <mc1586182829@outlook.com>"]
repository = "https://github.com/ProjectArcturius/arc-deck"

[workspace.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_Ime",
    "Win32_UI_WindowsAndMessaging",
] }

# ── Arc Deck 产品 crate（core / dsh / cli）───────────────────────────────
#
# 版本只写主版本号，具体小版本由 Cargo.lock 钉住；离线构建用的
# registry 缓存里已有这些 crate（见 AGENTS.md 的构建说明）。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    # 假 SDK 对端要直接接 stdin/stdout —— `io-std` 提供 tokio 版的这两条流。
    "io-std",
    "process",
    "sync",
    "time",
    "fs",
    "signal",
] }
