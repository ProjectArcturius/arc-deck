[package]
name = "arc-deck-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Arc Deck headless worker 命令"

[[bin]]
name = "arcdeck"
path = "src/main.rs"

[features]
# 打开假 SDK 对端与 `__fixture-sdk` 隐藏子命令。离线验收必须显式开启它。
test-runtime = ["arc-deck-dsh/test-runtime"]

[dependencies]
arc-deck-core = { path = "../arc-deck-core" }
arc-deck-dsh = { path = "../arc-deck-dsh" }
arc-deck-tui = { path = "../arc-deck-tui" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
